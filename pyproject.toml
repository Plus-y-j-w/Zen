[project]
name = "zen"
version = "0.1.0"
description = "Zen FastAPI Cloudflare Workers Application"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "python-jose",
    "python-dotenv",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
